AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Vitreen, the online page of neighbourhood shops, created and run from WhatsApp

Parameters:
  PhoneNumberId:
    Type: String
    Description: WhatsApp phone number id in AWS End User Messaging Social (phone-number-id-...), empty until the number is linked
    Default: ""
    AllowedPattern: "^(phone-number-id-[a-z0-9]+)?$"
  BusinessPhone:
    Type: String
    Description: WhatsApp Business number in international format, digits only (for wa.me links and the QR code), empty until the number is linked
    Default: ""
    AllowedPattern: "^([0-9]{8,15})?$"
  SenderEmail:
    Type: String
    Description: Sender address verified in Amazon SES, for example vitreen@boxboxd.fun
  SenderDomain:
    Type: String
    Description: Domain verified in Amazon SES, for example boxboxd.fun
  SupabaseUrl:
    Type: String
    Description: Supabase project URL of the Vitreen site, so the WhatsApp agent also serves shops published on the site (empty to disable)
    Default: ""
  SupabaseAnonKey:
    Type: String
    Description: Supabase public anon key, used only to read published shops and call create_public_order
    Default: ""
  DirectoryOwnerWaId:
    Type: String
    Description: WhatsApp number that receives orders for shops from the site, digits only
    Default: ""
  SiteUrl:
    Type: String
    Description: Public URL of the Vitreen site
    Default: ""
  BedrockModelId:
    Type: String
    Description: Bedrock model or inference profile able to read images
    Default: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
  MessagingPoolId:
    Type: String
    Description: AWS End User Messaging pool holding the RCS agent and an SMS number (RCS with automatic SMS fallback), or the RCS agent ARN alone (empty to disable)
    Default: ""
    AllowedPattern: "^(pool-[a-zA-Z0-9]+|arn:aws:sms-voice:[a-z0-9-]+:[0-9]{12}:rcs-agent/rcs-[a-f0-9]+)?$"
  BedrockRoleArn:
    Type: String
    Description: Role in another account of the organisation that the functions assume to call Bedrock (empty to call Bedrock in this account)
    Default: ""
    AllowedPattern: "^(arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)?$"
  OpsEmail:
    Type: String
    Description: Address that receives operational alarms (empty to disable)
    Default: ""

Conditions:
  HasOpsEmail: !Not [!Equals [!Ref OpsEmail, ""]]
  HasBedrockRole: !Not [!Equals [!Ref BedrockRoleArn, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    CodeUri: .
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        BUCKET_NAME: !Ref MediaBucket
        PHONE_NUMBER_ID: !Ref PhoneNumberId
        MODEL_ID: !Ref BedrockModelId
        BUSINESS_PHONE: !Ref BusinessPhone
        SENDER_EMAIL: !Ref SenderEmail
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
        DIRECTORY_OWNER_WA_ID: !Ref DirectoryOwnerWaId
        SITE_URL: !Ref SiteUrl
        MESSAGING_POOL_ID: !Ref MessagingPoolId
        BEDROCK_ROLE_ARN: !Ref BedrockRoleArn

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  WhatsAppTopic:
    Type: AWS::SNS::Topic

  WhatsAppTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref WhatsAppTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: social-messaging.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref WhatsAppTopic
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }

  TextInboundTopic:
    Type: AWS::SNS::Topic

  TextInboundTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref TextInboundTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: sms-voice.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref TextInboundTopic
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }

  InboundDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  InboundFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/inbound.handler
      Timeout: 120
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt InboundDeadLetterQueue.Arn
      Environment:
        Variables:
          PAGE_URL: !GetAtt PageFunctionUrl.FunctionUrl
      Events:
        WhatsApp:
          Type: SNS
          Properties: { Topic: !Ref WhatsAppTopic }
        RcsAndSms:
          Type: SNS
          Properties: { Topic: !Ref TextInboundTopic }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action: [social-messaging:SendWhatsAppMessage, social-messaging:GetWhatsAppMessageMedia]
              Resource: !Sub "arn:${AWS::Partition}:social-messaging:${AWS::Region}:${AWS::AccountId}:phone-number-id/${PhoneNumberId}"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}"
            - Effect: Allow
              Action: [sms-voice:SendTextMessage]
              Resource: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:*"
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
              Resource: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/vitreen-*"

  PageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/page.handler
      Timeout: 15
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action: [social-messaging:SendWhatsAppMessage]
              Resource: !Sub "arn:${AWS::Partition}:social-messaging:${AWS::Region}:${AWS::AccountId}:phone-number-id/${PhoneNumberId}"
            - Effect: Allow
              Action: [sms-voice:SendTextMessage]
              Resource: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:*"
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}"

  DigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/digest.handler
      Timeout: 300
      Events:
        Weekly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 7 ? * MON *)"
            ScheduleExpressionTimezone: Europe/Paris
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}"

  BedrockRolePolicy:
    Type: AWS::IAM::Policy
    Condition: HasBedrockRole
    Properties:
      PolicyName: assume-bedrock-role
      Roles: [!Ref InboundFunctionRole, !Ref DigestFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref BedrockRoleArn

  OpsTopic:
    Type: AWS::SNS::Topic
    Condition: HasOpsEmail
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref OpsEmail }

  InboundErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The WhatsApp, RCS and SMS agent failed on at least one message
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref InboundFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasOpsEmail, [!Ref OpsTopic], !Ref AWS::NoValue]

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Inbound messages could not be processed after retries and wait in the dead letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt InboundDeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasOpsEmail, [!Ref OpsTopic], !Ref AWS::NoValue]

  PageErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The shop pages returned errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref PageFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasOpsEmail, [!Ref OpsTopic], !Ref AWS::NoValue]

Outputs:
  WhatsAppTopicArn:
    Description: SNS topic to select as the event destination of the WhatsApp number
    Value: !Ref WhatsAppTopic
  TextInboundTopicArn:
    Description: SNS topic to set as the two-way destination of the RCS agent and the SMS number
    Value: !Ref TextInboundTopic
  PageUrl:
    Description: Public URL of the pages
    Value: !GetAtt PageFunctionUrl.FunctionUrl
